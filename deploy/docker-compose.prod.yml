# Despliegue en una instancia: PostgreSQL sin puertos expuestos y la API en el puerto 80.
# Las variables se leen de deploy/.env (lo genera la instancia desde SSM Parameter Store).
name: checkout

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkout
      POSTGRES_DB: checkout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout"]
      interval: 5s
      retries: 10

  api:
    image: checkout-api:latest
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://checkout:${DB_PASSWORD}@db:5432/checkout
      DB_SYNC: "true"
      TRUST_PROXY_HOPS: "1"
    ports:
      - "${API_PORT:-80}:3000"

volumes:
  db-data:
